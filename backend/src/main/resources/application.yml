spring:
  application:
    name: mealfit
  config:
    # 루트 .env를 읽는다 (backend/에서 실행하든 루트에서 실행하든). 없으면 무시.
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mealfit}
    username: ${DB_USERNAME:mealfit}
    password: ${DB_PASSWORD:mealfit}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # 스키마는 Flyway만 변경한다 (db/migration)
    properties:
      hibernate:
        default_batch_fetch_size: 100
        jdbc.time_zone: Asia/Seoul
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Seoul
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}

mealfit:
  jwt:
    # 운영/공유 서버에서는 반드시 JWT_SECRET 환경 변수로 교체 (Base64, 32바이트 이상)
    secret: ${JWT_SECRET:bWVhbGZpdC1sb2NhbC1kZXYtand0LXNlY3JldC1rZXktY2hhbmdlLW1lLTIwMjY=}
    access-token-validity: 30m
    refresh-token-validity: 14d
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  ai:
    # Python AI 서비스(FastAPI + Gemini). Gemini 키는 Python 쪽에만 둔다.
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
    connect-timeout: 3s
    read-timeout: 20s

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health,info
