spring:
  datasource:
    url: jdbc:h2:mem:mealfit;MODE=MariaDB;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate

# 테스트 전용 공개 키입니다. 운영·로컬 JWT_SECRET과 무관하게 CI를 실행합니다.
jwt:
  secret: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  access-token-ttl: 30m
  refresh-token-ttl: 14d
